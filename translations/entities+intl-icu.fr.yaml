# The names of omnibase/forum's entities, which omnibase/admin titles its screens with
# (the fr of /admin/categories, /admin/topics).
forum:
  category:
    _singular: "forum"
    _plural: "forums"
  topic:
    _singular: "sujet"
    _plural: "sujets"
  post:
    _singular: "message"
    _plural: "messages"
  poll:
    _singular: "sondage"
    _plural: "sondages"
  poll_vote:
    _singular: "vote"
    _plural: "votes"
