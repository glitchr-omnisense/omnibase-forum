# The names of omnibase/forum's entities, which omnibase/admin titles its screens with
# (the en of /admin/categories, /admin/topics).
forum:
  category:
    _singular: "board"
    _plural: "boards"
  topic:
    _singular: "topic"
    _plural: "topics"
  post:
    _singular: "post"
    _plural: "posts"
  poll:
    _singular: "poll"
    _plural: "polls"
  poll_vote:
    _singular: "vote"
    _plural: "votes"
